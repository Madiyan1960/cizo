<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Электронная очередь</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .header-title {
            text-align: center;
            margin-bottom: 16px;
        }

        .header-title h1 {
            font-size: 1.4rem;
            margin: 0;
            color: var(--text);
        }

        /* 📅 Вкладки переключения дней */
        .tabs { 
            display: flex; 
            gap: 8px; 
            margin-bottom: 16px; 
        }

        .tab-btn {
            flex: 1;
            padding: 12px 8px;
            border: none;
            background: #e2e8f0;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
            color: #475569;
        }

        .tab-btn.active { 
            background: var(--primary); 
            color: white; 
        }

        .card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 16px;
        }

        .list-date-header {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            padding-bottom: 10px;
            border-bottom: 2px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .queue-list-scroll { 
            max-height: 70vh; 
            overflow-y: auto; 
            padding-right: 4px; 
        }

        .queue-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .queue-num {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            margin-right: 12px;
            min-width: 36px;
        }

        .queue-info { 
            flex-grow: 1; 
        }

        .queue-name {
            font-size: 1.25rem; 
            font-weight: bold;
            color: var(--text);
            line-height: 1.2;
            text-transform: capitalize;
        }

        .queue-note {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 3px;
        }

        .empty-msg { 
            text-align: center; 
            color: #94a3b8; 
            padding: 24px 0; 
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header-title">
        <h1>📋 Электронная очередь</h1>
    </div>

    <!-- 📅 ВКЛАДКИ -->
    <div class="tabs">
        <button class="tab-btn active" id="tabToday" onclick="switchTab('today')">Сегодня</button>
        <button class="tab-btn" id="tabTomorrow" onclick="switchTab('tomorrow')">Завтра</button>
    </div>

    <!-- 📋 СПИСОК ОЧЕРЕДИ -->
    <div class="card">
        <div class="list-date-header">
            <span id="listDateDisplay">📅 ...</span>
        </div>
        
        <div class="queue-list-scroll">
            <div id="queueList"><div class="empty-msg">Загрузка списка...</div></div>
        </div>
    </div>

</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAxYYpIj3Gu5Kvxv971xbgGneDEt2HP3A4",
        authDomain: "queueapp-e3f57.firebaseapp.com",
        databaseURL: "https://queueapp-e3f57-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "queueapp-e3f57",
        storageBucket: "queueapp-e3f57.firebasestorage.app",
        messagingSenderId: "648656253392",
        appId: "1:648656253392:web:33bc978a24e23d4a9f89d5"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentTab = 'today';
    let currentData = { todayList: [], tomorrowList: [] };
    let HOLIDAYS = [];
    let WORKDAYS = [];

    window.onload = function() {
        initDatabaseListeners();
    };

    function initDatabaseListeners() {
        // Загрузка праздничных дней
        db.ref('settings/holidays').on('value', (snapshot) => {
            const val = snapshot.val();
            HOLIDAYS = val ? Object.values(val) : [];
            HOLIDAYS.sort();
            render();
        });

        // Загрузка рабочих переносов
        db.ref('settings/workdays').on('value', (snapshot) => {
            const val = snapshot.val();
            WORKDAYS = val ? Object.values(val) : [];
            WORKDAYS.sort();
            render();
        });

        // Загрузка списков очереди в реальном времени
        db.ref('queue').on('value', (snapshot) => {
            const data = snapshot.val() || {};
            cleanupAndRotateQueue(data);

            const dates = getQueueDates();
            const rawToday = data[dates.today] ? Object.values(data[dates.today]) : [];
            const rawTomorrow = data[dates.tomorrow] ? Object.values(data[dates.tomorrow]) : [];

            rawToday.sort((a, b) => Number(a.number) - Number(b.number));
            rawTomorrow.sort((a, b) => Number(a.number) - Number(b.number));

            currentData = { todayList: rawToday, tomorrowList: rawTomorrow };
            render();
        });
    }

    // 📅 Проверка на нерабочий день
    function isNonWorkingDay(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const dayNum = String(date.getDate()).padStart(2, '0');
        const localIsoString = `${year}-${month}-${dayNum}`;

        if (WORKDAYS.includes(localIsoString)) {
            return false;
        }

        const day = date.getDay();
        return day === 0 || day === 6 || HOLIDAYS.includes(localIsoString);
    }

    // 📅 Получение следующего рабочего дня
    function getNextWorkingDate(startDate) {
        let date = new Date(startDate);
        date.setDate(date.getDate() + 1);
        while (isNonWorkingDay(date)) {
            date.setDate(date.getDate() + 1);
        }
        return date;
    }

    // 📅 Расчет дат
    function getQueueDates() {
        const realToday = new Date();
        const nextWorkingDay = getNextWorkingDate(realToday);

        const formatDate = (d) => {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const dayNum = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${dayNum}`;
        };

        return {
            today: formatDate(realToday),
            tomorrow: formatDate(nextWorkingDay),
            todayObj: realToday,
            tomorrowObj: nextWorkingDay
        };
    }

    function updateListDateDisplay() {
        const dates = getQueueDates();
        const targetDate = currentTab === 'today' ? dates.todayObj : dates.tomorrowObj;
        const options = { day: '2-digit', month: '2-digit', year: 'numeric', weekday: 'short' };

        document.getElementById('listDateDisplay').innerText = `📅 ${targetDate.toLocaleDateString('ru-RU', options)}`;
    }

    // 🧹 Автоматическая ротация и стирание прошлых записей
    function cleanupAndRotateQueue(data) {
        const dates = getQueueDates();
        for (const dateKey in data) {
            if (dateKey < dates.today) {
                db.ref('queue/' + dateKey).remove();
            }
        }
    }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tabToday').classList.toggle('active', tab === 'today');
        document.getElementById('tabTomorrow').classList.toggle('active', tab === 'tomorrow');
        render();
    }

    // 📋 Отображение списка
    function render() {
        updateListDateDisplay();

        const listKey = currentTab === 'today' ? 'todayList' : 'tomorrowList';
        const list = currentData[listKey] || [];
        const container = document.getElementById('queueList');

        if (list.length === 0) {
            container.innerHTML = `<div class="empty-msg">Очередь на этот день пуста</div>`;
            return;
        }

        container.innerHTML = list.map(item => `
            <div class="queue-item">
                <div class="queue-num">${item.number}</div>
                <div class="queue-info">
                    <div class="queue-name">${item.name}</div>
                    <div class="queue-note">⏱️ Записан: ${item.note || '—'}</div>
                </div>
            </div>
        `).join('');
    }
</script>

</body>
</html>
